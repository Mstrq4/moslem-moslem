name: Build diagnostic

on:
  push:
    branches:
      - diagnose/firebase-connection-20260926

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - run: npm install
      - run: npm run build
